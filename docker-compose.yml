services:
  tender-scraper:
    build: .
    image: tender-scraper:latest
    container_name: tender-scraper
    restart: unless-stopped
    env_file: .env
    ports:
      # Loopback only by default: a reverse proxy on the same host provides TLS.
      # Set BIND_ADDRESS=0.0.0.0 to expose the port directly.
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8000"
    volumes:
      # Persists job folders (attachments, summary.json, website.html).
      - scraper-data:/data

volumes:
  scraper-data:
